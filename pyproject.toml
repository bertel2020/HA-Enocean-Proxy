[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["enocean_proxy/app"]
timeout = 30

[tool.mypy]
python_version = "3.14"
strict = true
files = ["enocean_proxy/app/enocean_proxy"]

[[tool.mypy.overrides]]
module = "serial_asyncio_fast"
ignore_missing_imports = true
