<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnOcean Proxy</title>
<style>
  :root {
    --bg: #f5f5f5; --surface: #fff; --text: #212121; --muted: #6f6f6f; --line: #e3e3e3;
    --soft: #efefef; --accent: #03a9f4; --ok: #2e7d32; --bad: #c62828; --warn: #b26a00; --on-strong: #fff;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111; --surface: #1c1c1c; --text: #e6e6e6; --muted: #9a9a9a; --line: #2c2c2c;
      --soft: #262626; --accent: #4fc3f7; --ok: #66bb6a; --bad: #ef5350; --warn: #ffb74d; --on-strong: #111;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 Roboto, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
  h1 { margin: 0; font-size: 22px; font-weight: 400; }
  h2 { margin: 0; font-size: 18px; font-weight: 500; }
  h3 { margin: 0; font-size: 12px; font-weight: 500; text-transform: uppercase;
    letter-spacing: .04em; color: var(--muted); }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); }
  .note { font-size: 12px; color: var(--muted); }
  .error { color: var(--bad); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .spacer { flex: 1; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; display: grid; gap: 10px; min-width: 0; align-content: start; }
  .stack { display: grid; gap: 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

  /* header */
  .app { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .app .meta { font-size: 13px; color: var(--muted); }

  /* pills, dots, tags */
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
    font-size: 12px; background: var(--soft); color: var(--muted); white-space: nowrap; border: 0; }
  .pill i, .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; display: inline-block; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .info { color: var(--accent); }
  .pill.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); }
  .pill.info { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .live i { animation: pulse 1.6s infinite; }
  .live.bad i { animation: none; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .live i { animation: none; } }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
  .tag.accent { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .tag.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }

  /* controls */
  button, select, input { font: inherit; font-size: 13px; color: var(--text); }
  button, select { background: var(--soft); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--on-strong); border-color: transparent; }
  button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
  button.danger.solid { background: var(--bad); color: var(--on-strong); border-color: transparent; }
  button.link { background: none; border: 0; padding: 0; color: var(--accent); border-radius: 4px; }
  button.icon { padding: 2px 8px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: default; }
  button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  input[type=text], input[type=search] { background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; min-width: 0; }
  label.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
  label.field select { max-width: 100%; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); }

  /* gateway switcher and tabs */
  .switcher { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .gwchip { display: flex; align-items: center; gap: 8px; border-radius: 10px; padding: 8px 14px;
    background: var(--surface); border: 1px solid var(--line); white-space: nowrap; text-align: left; }
  .gwchip[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .gwchip small { color: var(--muted); font-size: 12px; }
  .gwhead .title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .gwhead .sub { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; font-family: var(--mono); }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .tabs button { border: 0; border-radius: 0; background: none; padding: 10px 14px; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .badge { font-size: 11px; min-width: 18px; padding: 0 6px; border-radius: 999px; text-align: center;
    background: var(--soft); color: var(--muted); }
  .badge.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .badge.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }

  /* overview */
  .health { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .health li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--line); border-left: 4px solid currentColor; }
  .health li > div { color: var(--text); }
  .health .dot { margin-top: 6px; }
  .allgood { padding: 10px 12px; border-radius: 10px; color: var(--ok);
    background: color-mix(in srgb, var(--ok) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent); }
  .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .metric { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .metric b { display: block; font-size: 22px; font-weight: 400; }
  .metric span { font-size: 12px; color: var(--muted); }
  .metric.warn b { color: var(--warn); }
  .bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
  ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  ul.plain li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .cardhead { display: flex; align-items: center; gap: 8px; }
  .cardhead h3 { flex: 1; }

  /* frames */
  .mtools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .mtools input[type=search] { flex: 1 1 200px; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .seg button small { color: var(--muted); margin-left: 4px; }
  .frames { overflow: auto; max-height: 60vh; border: 1px solid var(--line); border-radius: 8px; }
  .frames.short { max-height: none; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td, th { padding: 5px 10px; border-top: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: middle; }
  th { border-top: 0; color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--surface); z-index: 1; }
  td.hex { font-family: var(--mono); white-space: normal; overflow-wrap: anywhere; min-width: 16ch; }
  td.act { text-align: right; }
  .rx { color: var(--muted); } .tx { color: var(--accent); }
  .empty { color: var(--muted); padding: 16px; text-align: center; }

  /* tools */
  .check { font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-height: 20px; }
  .hexin { flex: 1 1 280px; font-family: var(--mono); }
  .caution { font-size: 12px; padding: 8px 10px; border-radius: 8px; color: var(--text);
    background: color-mix(in srgb, var(--bad) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--bad) 25%, transparent); }
  .history { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 12px; }
  .history li { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; padding: 6px 0; border-top: 1px solid var(--line); }
  .history .mono { overflow-wrap: anywhere; }
  .result { font-size: 13px; }
  .runbox { border-left: 4px solid var(--warn); }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
  .stats b { font-weight: 500; }
  details.help > summary { cursor: pointer; font-weight: 500; }
  details.help ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13px; }

  body.stale #content { opacity: .55; }

  @media (max-width: 640px) {
    main { padding: 12px 16px; }
    .grid2 { grid-template-columns: minmax(0, 1fr); }
    .tabs button { padding: 10px 9px; }
    .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .metric b { font-size: 18px; }
    .frames table, .frames tbody, .frames tr, .frames td { display: block; }
    .frames thead { display: none; }
    .frames tr { display: grid; grid-template-columns: auto auto 1fr auto; gap: 2px 8px; padding: 8px 10px;
      border-top: 1px solid var(--line); align-items: center; }
    .frames td { border: 0; padding: 0; white-space: nowrap; }
    .frames td.hex { grid-column: 1 / -1; }
    .frames td.peer:empty, .frames td.sender:empty { display: none; }
    .frames td.act { grid-column: 4; grid-row: 1; }
  }
</style>
</head>

// helpers ---------------------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fill = (text, values) => text.replace(/\{(\w+)\}/g, (_m, k) => values[k] ?? "–");
const duration = (s) => {
  s = Math.max(0, Math.round(s));
  if (s < 60) return `${s} s`;
  if (s < 3600) return `${Math.round(s / 60)} min`;
  if (s < 86400) return `${(s / 3600).toFixed(1)} h`;
  return `${(s / 86400).toFixed(1)} d`;
};
const size = (b) => (b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(0)} KB` : `${(b / 1048576).toFixed(1)} MB`);
const LOCALE = DE ? "de-DE" : "en-GB";
const hms = (t) => new Date(t * 1000).toLocaleTimeString(LOCALE, { hour12: false });
const clock = (t) => `${hms(t)}.${String(new Date(t * 1000).getMilliseconds()).padStart(3, "0")}`;
const stamp = (t) => new Date(t * 1000).toLocaleString(LOCALE, { hour12: false, day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const num = (n) => Number(n || 0).toLocaleString(LOCALE);
const kindLabel = (k) => ({ radio: T.radio, answer: T.answers, other: T.other })[k] || k;

// what the viewer looked at last (gateway, tab) survives a reload; storage may be blocked
const VIEW_KEY = "enocean-proxy-view";
const saved = (() => { try { return JSON.parse(localStorage.getItem(VIEW_KEY)) || {}; } catch (err) { return {}; } })();
const TABS = ["overview", "monitor", "capture", "tools"];
const state = {
  last: null, stale: false, seq: 0, shown: 0, loading: false,  // seq/shown: late answers never replace newer ones
  gw: saved.gw || null, tab: TABS.includes(saved.tab) ? saved.tab : "overview",
  built: "", panel: "",
  paused: false, frozen: null, pausedAt: 0, kind: "", dir: "", q: "",  // monitor filters
  hex: {}, sends: {}, tests: {}, busy: {},  // tools, per gateway name
};

// Redraw only what changed, every 2 s: text being selected (to copy a frame) is left alone
// until the next round, and the focus stays on the same button or link.
const drawn = new WeakMap();
let forced = false;  // a click of the user redraws even over a selection
const FOCUS_KEYS = ["data-delete", "href", "data-kind", "data-gw", "data-copy", "data-tpl", "data-q", "data-goto"];
const selecting = (el) => {
  const sel = document.getSelection();
  return !!sel && !sel.isCollapsed && el.contains(sel.anchorNode);
};
function draw(el, html) {
  if (!el || drawn.get(el) === html || (!forced && selecting(el))) return;
  const active = document.activeElement;
  const focus = el.contains(active) ? FOCUS_KEYS.map((a) => [a, active.getAttribute(a)]).find(([, v]) => v != null) : null;
  el.innerHTML = html;
  drawn.set(el, html);
  if (focus) [...el.querySelectorAll(`[${focus[0]}]`)].find((n) => n.getAttribute(focus[0]) === focus[1])?.focus({ preventScroll: true });
}
const text = (el, value) => { if (el && el.textContent !== value) el.textContent = value; };
// newest frames come on top: someone scrolled down keeps looking at the same frames
function drawFrames(el, html) {
  const top = el.getBoundingClientRect().top + (el.querySelector("thead")?.getBoundingClientRect().height || 0);
  const anchor = el.scrollTop > 0 ? [...el.querySelectorAll("tr[data-k]")].find((r) => r.getBoundingClientRect().bottom > top) : null;
  const offset = anchor ? anchor.getBoundingClientRect().top - top : 0;
  draw(el, html);
  const row = anchor && [...el.querySelectorAll("tr[data-k]")].find((r) => r.dataset.k === anchor.dataset.k);
  if (row) el.scrollTop += row.getBoundingClientRect().top - top - offset;
}

async function api(path, body) {
  const response = await fetch(path, body === undefined ? { cache: "no-store" } : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const raw = await response.text();
  let data = null;
  try { data = JSON.parse(raw); } catch (err) { /* plain text answer */ }
  if (!response.ok) throw new Error((data && data.error) || raw || response.statusText);
  return data;
}

async function copy(value) {
  try { await navigator.clipboard.writeText(value); return true; } catch (err) { /* blocked in the ingress frame */ }
  const area = Object.assign(document.createElement("textarea"), { value });
  area.style.position = "fixed"; area.style.opacity = "0";
  document.body.append(area); area.select();
  const ok = document.execCommand("copy");
  area.remove();
  return ok;
}

// frames: parse and check what the user types before it goes out ---------------------------------
const parseHex = (raw) => {
  const hex = raw.replace(/[\s:-]/g, "");
  if (!hex) return [];
  if (/[^0-9a-fA-F]/.test(hex) || hex.length % 2) return null;
  return hex.match(/../g).map((b) => parseInt(b, 16));
};
const toHex = (bytes) => bytes.map((b) => b.toString(16).padStart(2, "0").toUpperCase()).join(" ");
const crc8 = (bytes) => bytes.reduce((crc, byte) => {
  crc ^= byte;
  for (let i = 0; i < 8; i++) crc = crc & 0x80 ? ((crc << 1) ^ 0x07) & 0xff : (crc << 1) & 0xff;
  return crc;
}, 0);
const hx = (b) => b.toString(16).padStart(2, "0").toUpperCase();

// {level: ok|bad|empty, msg, fix: corrected bytes or null}
function checkFrame(bytes, protocol) {
  if (bytes === null) return { level: "bad", msg: T.badHex };
  if (!bytes.length) return { level: "empty", msg: T.cEmpty };
  const proto = protocol.toUpperCase();
  if (protocol === "esp2") {
    if (bytes[0] !== 0xa5 || bytes[1] !== 0x5a) return { level: "bad", msg: T.cSync2 };
    const sum = bytes.slice(2, 13).reduce((a, b) => a + b, 0) & 0xff;
    if (bytes.length === 13) return { level: "bad", msg: fill(T.cLen2, { n: 13 }), fix: [...bytes, sum], fixLabel: T.cAdd };
    if (bytes.length !== 14) return { level: "bad", msg: fill(T.cLen2, { n: bytes.length }) };
    if (bytes[13] !== sum) return { level: "bad", msg: fill(T.cSum, { want: hx(sum) }), fix: [...bytes.slice(0, 13), sum], fixLabel: T.cFix };
    return { level: "ok", msg: fill(T.cOk, { proto }) };
  }
  if (bytes[0] !== 0x55) return { level: "bad", msg: T.cSync3 };
  if (bytes.length < 7) return { level: "bad", msg: T.cShort3 };
  const hcrc = crc8(bytes.slice(1, 5));
  if (bytes[5] !== hcrc) { const fix = [...bytes]; fix[5] = hcrc; return { level: "bad", msg: fill(T.cHcrc, { want: hx(hcrc) }), fix, fixLabel: T.cFix }; }
  const want = 7 + ((bytes[1] << 8) | bytes[2]) + bytes[3];
  const dcrc = crc8(bytes.slice(6, want - 1));
  if (bytes.length === want - 1) return { level: "bad", msg: fill(T.cLen3, { want, n: bytes.length }), fix: [...bytes, dcrc], fixLabel: T.cAdd };
  if (bytes.length !== want) return { level: "bad", msg: fill(T.cLen3, { want, n: bytes.length }) };
  if (bytes[want - 1] !== dcrc) return { level: "bad", msg: fill(T.cDcrc, { want: hx(dcrc) }), fix: [...bytes.slice(0, -1), dcrc], fixLabel: T.cFix };
  return { level: "ok", msg: fill(T.cOk, { proto }) };
}

// what is wrong with a gateway, worst first --------------------------------------------------
function issues(g) {
  const s = g.stats, out = [];
  const add = (level, title, body, values = {}) => out.push({ level, title: fill(title, values), body: fill(body, values) });
  if (!g.connected) {
    if (g.last_error) add("bad", T.iDown, T.iDownText, { error: g.last_error });
    else add("warn", T.iConnecting, T.iConnectingText);
  }
  if (g.duty_cycle.of_limit >= 80) add("bad", T.iDuty, T.iDutyText, { pct: g.duty_cycle.of_limit });
  else if (g.duty_cycle.of_limit >= 50) add("warn", T.iDuty, T.iDutyText, { pct: g.duty_cycle.of_limit });
  if (g.exclusive_peer) add("warn", T.iLocked, T.iLockedText, { peer: g.exclusive_peer });
  if (g.queue > 10) add("warn", T.iQueue, T.iQueueText, { n: g.queue });
  if (s.dropped) add("warn", T.iDropped, T.iDroppedText, { n: num(s.dropped) });
  if (s.slow_clients) add("warn", T.iSlow, T.iSlowText, { n: num(s.slow_clients) });
  if (s.refused) add("warn", T.iRefused, T.iRefusedText, { n: num(s.refused) });
  if (s.locked) add("info", T.iHeld, T.iHeldText, { n: num(s.locked) });
  if (!g.clients.length) add("info", T.iNoClients, T.iNoClientsText, { port: g.port });
  return out;
}
const levelOf = (list) => (list.some((i) => i.level === "bad") ? "bad" : list.some((i) => i.level === "warn") ? "warn" : "ok");
const current = () => state.last?.gateways.find((g) => g.name === state.gw) || state.last?.gateways[0];

// header, gateway switcher, gateway head, tabs ------------------------------------------------
function renderHeader() {
  const live = $("live");
  live.classList.toggle("ok", !state.stale && !!state.last);
  live.classList.toggle("bad", state.stale);
  text(live.querySelector("span"), state.stale ? T.offline : state.last ? T.live : T.loading);
  document.body.classList.toggle("stale", state.stale);
  const data = state.last;
  if (!data) return;
  const meta = `${T.version} ${data.version || "?"} · ${T.running} ${duration(data.now - data.started)}`;
  text($("meta"), state.stale ? `${meta} · ${fill(T.asOf, { time: hms(data.now) })}` : meta);
  const c = data.capture;
  draw($("capflag"), c.active ? `<button class="pill warn" data-goto="capture"><i></i>${T.captureRunning} · ${duration(data.now - c.started)}</button>` : "");
}

function buildShell(data) {
  $("gws").hidden = data.gateways.length < 2;
  $("gwhead").hidden = $("tabs").hidden = false;
  $("gwhead").innerHTML = `<div class="title"><h2 id="gw-name"></h2><span id="gw-pill"></span></div><div class="sub" id="gw-sub"></div>`;
  $("tabs").innerHTML = TABS.map((t) => `<button role="tab" id="tab-${t}" data-tab="${t}" aria-controls="panel">${esc(T[`tab${t[0].toUpperCase()}${t.slice(1)}`])}<span id="badge-${t}"></span></button>`).join("");
}

function renderShell(data, g) {
  draw($("gws"), data.gateways.map((x) => {
    const level = levelOf(issues(x));
    return `<button class="gwchip" role="tab" data-gw="${esc(x.name)}" aria-selected="${x.name === g.name}"><span class="dot ${level}"></span><span><b>${esc(x.name)}</b><br><small>${T.port} ${x.port} · ${esc(fill(x.clients.length === 1 ? T.program1 : T.programs, { n: x.clients.length }))}</small></span></button>`;
  }).join(""));
  text($("gw-name"), g.name);
  draw($("gw-pill"), g.connected
    ? `<span class="pill ok"><i></i>${T.connected}${g.connected_since ? ` · ${T.since} ${duration(data.now - g.connected_since)}` : ""}</span>`
    : g.last_error ? `<span class="pill bad"><i></i>${T.disconnected}</span>` : `<span class="pill warn"><i></i>${T.connecting}</span>`);
  text($("gw-sub"), [g.device, g.protocol.toUpperCase(), g.baudrate ? `${g.baudrate} Bd` : "", `${T.port} ${g.port}`].filter(Boolean).join(" · "));
  for (const t of TABS) {
    const tab = $(`tab-${t}`);
    tab.setAttribute("aria-selected", String(t === state.tab));
    tab.tabIndex = t === state.tab ? 0 : -1;
  }
  const list = issues(g).filter((i) => i.level !== "info");
  draw($("badge-overview"), list.length ? `<span class="badge ${levelOf(list)}">${list.length}</span>` : "");
  draw($("badge-capture"), data.capture.active ? `<span class="badge warn">${T.running_}</span>` : "");
  $("panel").setAttribute("aria-labelledby", `tab-${state.tab}`);
}

// telegrams ---------------------------------------------------------------------------------------
function frameTable(frames, actions) {
  if (!frames.length) return `<div class="empty">${T.none}</div>`;
  return `<table><thead><tr><th>${T.time}</th><th aria-label="${esc(T.dirLabel)}"></th><th>${T.kind}</th><th>${T.sender}</th><th>${T.peer}</th><th>${T.data}</th>${actions ? "<th></th>" : ""}</tr></thead><tbody>${frames.map((f) => `<tr data-k="${esc(`${f.time}|${f.dir}|${f.hex}`)}">
    <td class="mono">${clock(f.time)}</td>
    <td class="${f.dir === "tx" ? "tx" : "rx"}" title="${esc(f.dir === "tx" ? T.toGateway : T.fromGateway)}">${f.dir === "tx" ? "↑" : "↓"}</td>
    <td>${esc(kindLabel(f.kind))}${f.rorg ? ` <span class="tag">${esc(f.rorg)}</span>` : ""}</td>
    <td class="mono sender">${f.sender ? (actions ? `<button class="link mono" data-q="${esc(f.sender)}" title="${esc(T.filterId)}">${esc(f.sender)}</button>` : esc(f.sender)) : ""}</td>
    <td class="mono peer">${esc(f.peer || "")}</td>
    <td class="hex">${esc(f.hex.toUpperCase())}</td>
    ${actions ? `<td class="act"><button class="icon" data-copy="${esc(f.hex)}" title="${esc(T.copy)}" aria-label="${esc(T.copy)}">⧉</button> <button class="icon" data-tpl="${esc(f.hex)}" title="${esc(T.toSend)}" aria-label="${esc(T.toSend)}">↗</button></td>` : ""}
  </tr>`).join("")}</tbody></table>`;
}

function matches(f) {
  if (state.kind && f.kind !== state.kind) return false;
  if (state.dir && f.dir !== state.dir) return false;
  const q = state.q.trim().toLowerCase();
  if (!q) return true;
  const bare = q.replace(/[\s:-]/g, "");
  return (bare && (f.hex.replace(/ /g, "").includes(bare) || (f.sender || "").replace(/-/g, "").toLowerCase().includes(bare)))
    || (f.peer || "").toLowerCase().includes(q) || (f.rorg || "").toLowerCase() === q;
}

    </section>
    <section class="card"><h3>${T.files}</h3><div id="cap-files"></div></section>
    <details class="card help"><summary>${esc(T.pctHelp)}</summary><ol>${T.pctSteps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol></details>`,
  render(_g, data) {
    const c = data.capture;
    $("cap-run").hidden = !c.active;
    $("cap-form").hidden = c.active;
    if (c.active) {
      const file = c.files.find((f) => f.name === c.file);
      draw($("cap-stats"), [
        [T.capOn, c.gateway || T.allGateways], [T.capFrames, num(c.frames)], [T.capFor, duration(data.now - c.started)],
        [T.capFile, `${c.file}${file ? ` (${size(file.size)})` : ""}`], ...(c.exclusive_peer ? [[T.capAlone, c.exclusive_peer]] : []),
      ].map(([k, v]) => `<span><span class="muted">${esc(k)}:</span> <b>${esc(v)}</b></span>`).join(""));
    } else {
      const gw = data.gateways.find((x) => x.name === $("cap-gateway").value);
      const peers = gw ? [...new Set(gw.clients.map((cl) => cl.peer))] : [];
      const select = $("cap-peer");
      if (select.dataset.peers !== `${gw?.name}\n${peers.join("\n")}`) {  // an open list is not rebuilt every 2 s
        const chosen = select.value;
        select.innerHTML = `<option value="">${esc(T.everyone)}</option>` + peers.map((p) => `<option value="${esc(p)}"${p === chosen ? " selected" : ""}>${esc(fill(T.onlyPeer, { peer: p }))}</option>`).join("");
        select.dataset.peers = `${gw?.name}\n${peers.join("\n")}`;
      }
      select.disabled = !peers.length;
      text($("cap-peer-note"), !gw ? T.capPeerAll : !peers.length ? T.capPeerNone : T.capPeerNote);
    }
    draw($("cap-files"), c.files.length
      ? `<table><tbody>${c.files.map((f) => {
          const live = c.active && c.file === f.name;
          return `<tr><td class="hex"><a href="api/captures/${encodeURIComponent(f.name)}" download>${esc(f.name)}</a>${live ? ` <span class="tag warn">${T.running_}</span>` : ""}</td>
            <td class="muted">${f.modified ? esc(stamp(f.modified)) : ""}</td><td class="muted">${size(f.size)}</td>
            <td class="act">${live ? "" : `<button class="icon danger" data-delete="${esc(f.name)}">${T.del}</button>`}</td></tr>`;
        }).join("")}</tbody></table>`
      : `<div class="muted">${T.noFiles}</div>`);
  },
};

// tools -------------------------------------------------------------------------------------------
const blocked = (g) => (!g.connected ? T.whyDown : g.exclusive_peer ? fill(T.whyLocked, { peer: g.exclusive_peer }) : "");
PANELS.tools = {
  build: (g) => `
    <section class="card">
      <h3>${T.test}</h3>
      <p class="note">${esc(T.testNote)}</p>
      <div class="row"><button class="primary" id="test">${T.testStart}</button><span class="note" id="test-why"></span></div>
      <div id="test-out"></div>
    </section>
    <section class="card">
      <h3>${T.send}</h3>
      <p class="caution">⚠ ${esc(fill(T.sendNote, { proto: g.protocol.toUpperCase() }))}</p>
      <div class="row"><input type="text" class="hexin" id="hex" placeholder="${g.protocol === "esp2" ? "A5 5A 0B 07 …" : "55 00 0A 07 01 EB …"}" autocomplete="off" spellcheck="false" aria-label="${esc(T.hexLabel)}" aria-describedby="hex-check">
        <button class="danger" id="send">${T.sendBtn}</button></div>
      <div class="check" id="hex-check" aria-live="polite"></div>
      <div id="send-why" class="note"></div>
      <div id="send-out"></div>
    </section>`,
  init(g) {
    $("hex").value = state.hex[g.name] || "";
    checkInput(g);
  },
  render(g) {
    const why = blocked(g);
    const busy = !!state.busy[g.name];
    $("test").disabled = !!why || busy;
    text($("test"), busy ? T.testRunning : T.testStart);
    text($("test-why"), why ? fill(T.why, { reason: why }) : "");
    $("send").disabled = !!why;
    text($("send-why"), why ? fill(T.why, { reason: why }) : "");
    const t = state.tests[g.name];
    draw($("test-out"), !t ? "" : t.error ? `<div class="error">${T.error}: ${esc(t.error)}</div>` : `
      <div class="bar"><div style="width:${(t.answered * 100) / t.sent}%;background:${t.lost ? "var(--warn)" : "var(--ok)"}"></div></div>
      <div class="result"><b>${esc(fill(T.testResult, t))}</b> · ${esc(fill(T.testTimes, { avg: t.avg_ms ?? "–", max: t.max_ms ?? "–" }))}</div>
      <div class="note ${t.lost ? "warn" : "ok"}">${esc(t.lost ? fill(T.testLost, t) : T.testGood)} <span class="muted">(${hms(t.at)})</span></div>`);
    const log = state.sends[g.name] || [];
    draw($("send-out"), log.length ? `<h3 style="margin:6px 0 2px">${T.sentLog}</h3><ul class="history">${log.map((e) => `<li>
      <span class="muted mono">${hms(e.at)}</span><span class="mono">↑ ${esc(e.hex)}</span>
      <span></span>${e.error ? `<span class="error">${T.error}: ${esc(e.error)}</span>` : `<span class="mono">↓ ${esc(e.answer ? e.answer.toUpperCase() : T.noAnswer)}</span>`}</li>`).join("")}</ul>` : "");
  },
};

function checkInput(g) {
  const raw = $("hex").value;
  state.hex[g.name] = raw;
  const bytes = parseHex(raw);
  const r = checkFrame(bytes, g.protocol);
  const parts = [];
  if (bytes && bytes.length) parts.push(`<span class="muted">${fill(T.cBytes, { n: bytes.length })}</span>`);
  parts.push(`<span class="${r.level === "ok" ? "ok" : r.level === "bad" ? "error" : "muted"}">${r.level === "ok" ? "✓ " : r.level === "bad" ? "✗ " : ""}${esc(r.msg)}</span>`);
  if (r.fix) parts.push(`<button class="icon" id="hex-fix" data-fix="${esc(toHex(r.fix))}">${esc(r.fixLabel)}</button>`);
  $("hex-check").innerHTML = parts.join("");
}

// render loop ---------------------------------------------------------------------------------------
function render() {
  renderHeader();
  const data = state.last;
  if (!data) return;
  if (!data.gateways.length) { draw($("panel"), `<section class="card empty">${esc(T.noGateways)}</section>`); return; }
  const key = data.gateways.map((g) => g.name).join("|");
  if (state.built !== key) { buildShell(data); state.built = key; state.panel = ""; }
  const g = current();
  state.gw = g.name;
  renderShell(data, g);
  const panelKey = `${key}|${g.name}|${state.tab}`;
  const panel = PANELS[state.tab];
  if (state.panel !== panelKey) {
    $("panel").innerHTML = panel.build(g, data);
    state.panel = panelKey;
    panel.init?.(g);
  }
  panel.render(g, data);
}

async function refresh(force = false) {
  // the timer skips while an answer is outstanding; actions refresh at once (force)
  if (!force && (document.hidden || state.loading)) return;
  const seq = ++state.seq;
  state.loading = true;
  try {
    const data = await api("api/status");
    if (seq < state.shown) return;
    state.shown = seq;
    state.last = data;
    state.stale = false;
    render();
  } catch (err) {
    if (seq < state.shown) return;
    state.shown = seq;
    state.stale = true;  // what is still shown is the last known state: say so, and from when
    renderHeader();
  } finally {
    if (seq === state.seq) state.loading = false;
  }
}

function select(changes) {
  Object.assign(state, changes);
  remember();
  forced = true; render(); forced = false;
}
function pause(on) {
  state.paused = on;
  const g = current();
  state.frozen = on && g ? g.recent.slice() : null;
  state.pausedAt = on ? (state.last?.now ?? Date.now() / 1000) : 0;
}

// events ------------------------------------------------------------------------------------------
document.addEventListener("click", async (e) => {
  const target = e.target.closest("button");
  if (!target) return;
  const g = current();
  const d = target.dataset;
  try {
    if (d.tab) select({ tab: d.tab });
    else if (d.gw) { if (d.gw !== state.gw) pause(false); select({ gw: d.gw }); }
    else if (d.goto) select({ tab: d.goto });
    else if (d.kind !== undefined) select({ kind: d.kind });
    else if (d.q !== undefined) { state.q = d.q; $("q").value = d.q; select({}); }
    else if (target.id === "m-clear") { state.kind = state.dir = state.q = ""; $("q").value = $("dir").value = ""; select({}); }
    else if (target.id === "pause") { pause(!state.paused); select({}); }
    else if (d.copy) { if (await copy(d.copy.toUpperCase())) { target.textContent = "✓"; setTimeout(() => { target.textContent = "⧉"; }, 1200); } }
    else if (d.tpl) { state.hex[g.name] = d.tpl.toUpperCase(); select({ tab: "tools" }); $("hex").focus(); }
    else if (d.fix) { $("hex").value = d.fix; checkInput(g); $("hex").focus(); }
    else if (target.id === "cap-start") {
      await api("api/capture/start", { gateway: $("cap-gateway").value || null, exclusive_peer: $("cap-peer").value || null });
      $("cap-out").textContent = "";
      await refresh(true);
    } else if (target.id === "cap-stop") {
      await api("api/capture/stop", {});
      await refresh(true);
    } else if (d.delete) {
      if (confirm(fill(T.confirmDelete, { name: d.delete }))) { await api(`api/captures/${encodeURIComponent(d.delete)}/delete`, {}); await refresh(true); }
    } else if (target.id === "test") {
      const name = g.name;
      state.busy[name] = true; render();
      try {
        state.tests[name] = { ...(await api("api/test", { gateway: name, count: 20 })), at: Date.now() / 1000 };
      } catch (err) {
        state.tests[name] = { error: err.message, at: Date.now() / 1000 };
      } finally {
        state.busy[name] = false; render();
      }
    } else if (target.id === "send") {
      // a typo is refused, never dropped: the confirmation shows the exact bytes that go out
      const bytes = parseHex($("hex").value);
      if (!bytes || !bytes.length) throw new Error(T.badHex);
      const hex = toHex(bytes);
      if (!confirm(`${fill(T.confirmSend, { gw: g.name })}\n\n${hex}`)) return;
      const log = (state.sends[g.name] ||= []);
      try {
        const r = await api("api/send", { gateway: g.name, hex: hex.replace(/ /g, "") });
        log.unshift({ at: Date.now() / 1000, hex, answer: r.answer });
      } catch (err) {
        log.unshift({ at: Date.now() / 1000, hex, error: err.message });
      }
      log.splice(5);
      render();
    }
  } catch (err) {
    const out = target.id === "cap-stop" ? $("cap-run-out") : target.id === "cap-start" || d.delete ? $("cap-out") : target.id === "send" ? $("hex-check") : null;
    if (out) out.innerHTML = `<span class="error">${T.error}: ${esc(err.message)}</span>`;
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { state.q = e.target.value; select({}); }
  else if (e.target.id === "hex") checkInput(current());
});
document.addEventListener("change", (e) => {
  if (e.target.id === "dir") select({ dir: e.target.value });
  else if (e.target.id === "cap-gateway") render();
});
// arrow keys move between tabs (and between gateways)
document.addEventListener("keydown", (e) => {
  const tab = e.target.closest?.('[role="tab"]');
  if (!tab || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
  const all = [...tab.parentElement.querySelectorAll('[role="tab"]')];
  const i = all.indexOf(tab);
  const next = all[e.key === "Home" ? 0 : e.key === "End" ? all.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + all.length) % all.length];
  e.preventDefault();
  next.click();
  const key = next.dataset.tab ? `data-tab="${next.dataset.tab}"` : `data-gw="${CSS.escape(next.dataset.gw)}"`;
  document.querySelector(`[role="tab"][${key}]`)?.focus();
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(true); });
renderHeader();
refresh(true);
setInterval(refresh, 2000);
</script>
</body>
</html>
