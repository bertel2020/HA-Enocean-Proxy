name: EnOcean Proxy
version: "0.1.0"
slug: enocean_proxy
description: Shares EnOcean gateways (FAM-USB, FGW14-USB, FAM14, USB300, ser2net) with several programs and replays telegrams missed during a Home Assistant restart
url: https://github.com/bertel2020/HA-Enocean-Proxy
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
uart: true
usb: true
ports:
  9100/tcp: 9100
  9101/tcp: 9101
  9102/tcp: 9102
  9103/tcp: 9103
ports_description:
  9100/tcp: First gateway
  9101/tcp: Second gateway
  9102/tcp: Third gateway
  9103/tcp: Fourth gateway
options:
  gateways:
    - name: FAM-USB
      device: /dev/ttyUSB0
      baudrate: 9600
      protocol: esp2
      port: 9100
  send_gap_ms: 10
  replay_size: 1000
  log_level: info
schema:
  gateways:
    - name: str
      device: str
      baudrate: list(9600|57600|115200)?
      protocol: list(esp2|esp3)
      port: port
  send_gap_ms: int(0,1000)
  replay_size: int(0,100000)
  log_level: list(debug|info|warning|error)
